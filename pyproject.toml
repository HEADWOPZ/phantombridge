[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantombridge-mcp"
version = "0.1.0"
description = "Read-only Solana wallet MCP server for Phantom-linked and raw pubkeys"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kevin Lance Murray" }]
keywords = ["solana", "phantom", "mcp", "wallet", "jupiter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.27.0",
  "pynacl>=1.5.0",
  "base58>=2.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
phantombridge-mcp = "phantombridge_mcp.server:main"

[project.urls]
Homepage = "https://github.com/HEADWOPZ/phantombridge"
Issues = "https://github.com/HEADWOPZ/phantombridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
